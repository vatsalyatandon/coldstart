apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: inference-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inference-server
      spec:
        template:
          spec:
            containers:
              - name: inference
                args:
                  - --model
                  - Qwen/Qwen2.5-7B-Instruct
                  - --host
                  - 0.0.0.0
                  - --port
                  - "8000"
                  - --tensor-parallel-size
                  - "2"
                resources:
                  requests:
                    nvidia.com/gpu: "2"
                  limits:
                    nvidia.com/gpu: "2"
