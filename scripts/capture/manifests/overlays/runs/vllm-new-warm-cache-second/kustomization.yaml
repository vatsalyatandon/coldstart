apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Second warm-cache run: apply in the same namespace without deleting the PVC.
resources:
  - ../../../bases/vllm

components:
  - ../../../components/versions/vllm-new-replace-me
  - ../../../components/node/warm-node
  - ../../../components/vllm/compile-cache-pvc

commonAnnotations:
  coldstart.sh/capture-run: vllm-new-warm-cache-hit
  coldstart.sh/cache-expectation: hit
