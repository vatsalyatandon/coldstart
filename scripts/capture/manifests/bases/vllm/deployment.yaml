apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server
  labels:
    app.kubernetes.io/name: inference-server
    app.kubernetes.io/part-of: coldstart-capture
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-server
        app.kubernetes.io/part-of: coldstart-capture
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: inference
          image: vllm/vllm-openai:REPLACE_ME_VLLM_VERSION
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen2.5-7B-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
